<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Configuración | Club del Spoiler</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/configuracion.css">


</head>

<body>


<header>

    <nav>

        <a href="index.html">
            Club del Spoiler
        </a>

        <div data-session-nav></div></nav>

</header>


<main>

    <header>

        <p>CONFIGURACIÓN</p>

        <h1>Personaliza la apariencia del sitio</h1>

    </header>


    <section>

        <h2>Apariencia</h2>


        <fieldset>

            <legend>Tema</legend>

            <label>

                <input
                    type="radio"
                    name="theme"
                    value="light"
                >

                ☀️ Claro

            </label>


            <label>

                <input
                    type="radio"
                    name="theme"
                    value="dark"
                >

                🌙 Oscuro

            </label>

        </fieldset>

    </section>


    <section>

        <h2>Estilo</h2>


        <label for="visualTheme">
            Tema visual
        </label>


        <select id="visualTheme">

            <option value="classic">
                Clásico
            </option>

            <option value="dark-academia">
                Dark Academia · Tech FILP
            </option>

            <option value="dark-romance">
                Dark Romance
            </option>

            <option value="fantasy">
                Fantasía
            </option>

            <option value="minimal">
                Minimalista
            </option>

        </select>

    </section>


    <p
        id="settingsMessage"
        aria-live="polite"
    ></p>

</main>


<footer>

    <p>
        Club del Spoiler · FILP
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/session.js"></script>
<script src="js/configuracion.js"></script>


</body>

</html>
